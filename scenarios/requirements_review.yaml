display_name: 需求评审汇报
description: 需求分析报告/需求规格说明书的专家评审，判断需求是否完整清晰、边界是否明确、指标能否验收
principle: 先讲背景与目标，再讲建设范围与边界（做什么、不做什么、交付什么），然后按业务需求、功能需求、数据需求、非功能需求逐项讲清楚"要做到什么"，最后讲考核验收标准与约束。功能需求是主体，每个主要功能模块都要讲到。
default_duration_min: 20
density: dense                  # 评审类默认高密度（0.5）
minutes_per_page: 1.4
structural_pages: [cover, agenda, closing]
structural_minutes: 0.3
closing_title: 恳请各位专家批评指正
title_style: 结论式标题，直接给出判断或关键事实，如"模型全生命周期可管可控，解译任务四步自助提交"
focus_checklist:
  - 项目背景、建设依据与要解决的问题
  - 建设目标与建设任务
  - 建设范围：做什么、不做什么、交付什么
  - 与相关项目或分包的关系和工作界线
  - 业务需求（主要痛点与对应的管理需求）
  - 功能需求：每个主要功能模块的核心功能
  - 数据需求，尤其是需要甲方或其他方提供的数据
  - 用户角色与使用对象
  - 非功能需求的量化指标（性能、可靠性、安全等）
  - 考核与验收标准
  - 实施计划（周期、阶段、合同金额等项目基本情况）、资源与关键约束
special_rules:
  - 不设“需评审确认事项”页：评审是专家提问、专家判断，汇报只把方案讲清楚，不替专家列议题。原文中写明待确认、待明确或作为备选的事项，在相关页面的要点或备注中如实说明（如“有监督微调为备选手段，评测不达标时启用”），不单独成页、不放在结尾
  - 原文中"需/须/应"是需求表述，不要写成"已实现"
  - 不得把业务痛点称为项目风险；原文有"约束与假设"时如实使用
confirm_page: false                # 是否允许“需确认事项”页（0.5：评审类不设，用户明确要求时除外）
skeleton_by: 需求模块              # 主要功能模块 / 业务域（业务需求与功能需求讲同一模块时合并为一个单元）
shell:
  before:
    - {module: 背景与范围, covers: 建设背景与目标、建设范围与边界（做什么、不做什么）、用户与角色、业务现状}
  after:
    - {module: 非功能与数据, covers: 数据需求、性能、安全、接口等非功能需求, optional: true}
    - {module: 验收与计划, covers: 考核验收标准、约束、实施周期与交付}
baseline_questions: [需求范围和边界是否清楚, 验收标准是否可度量]
