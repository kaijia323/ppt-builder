display_name: 立项评审汇报
description: 项目立项方案、项目建议书、可行性研究报告、项目申报书的专家评审，判断项目该不该立、建设内容是否必要、投资是否合理、效益能否实现、能否按期实施
principle: 按评审决策链讲：先用一页说清项目是什么（概况），再讲为什么必须做（政策依据、现状问题、需求），然后讲做什么、不做什么（建设目标与内容），怎么做（技术方案），花多少钱、怎么算的（投资估算），得到什么、怎么考核（绩效与效益），怎么组织实施（进度、组织、合规服务）。每页回答“该不该立、值不值、能不能做成”。
default_duration_min: 20
density: dense
minutes_per_page: 1.4
structural_pages: [cover, agenda, closing]
structural_minutes: 0.3
closing_title: 恳请各位专家批评指正
title_style: 结论式标题，直接给出判断或关键事实，如"五类短板对应五个子系统新增模块，总投资1159.42万元"
focus_checklist:
  - 项目概况：名称、申报与实施单位、总投资及构成、建设周期、采购方式
  - 立项必要性：政策依据、现状与存在问题、需求（问题与需求逐条对应）
  - 建设目标、建设内容与边界（做什么、不做什么）
  - 技术方案：总体架构、技术路线、安全可靠与国产化、与外部系统的协同
  - 投资估算：总投资构成、分项金额、测算依据（功能点、人月、单价、取费标准）
  - 绩效目标与效益：绩效指标、效益测算与考核方式
  - 实施安排：进度计划、组织方式、监理与测评等合规服务、风险
special_rules:
  - 不设“需评审确认事项”页：评审是专家提问、专家判断，汇报只把方案讲清楚，不替专家列议题
  - 概况页必须讲清总投资及其构成；投资估算章讲分项金额和测算依据，不要只给总数
  - 原文没有的内容（如没有实施进度计划、没有风险分析）不设页、不补写，由检查点提示“原文未给出”
  - 预算明细表、功能点清单很长时只讲汇总口径（各分项金额、调整后功能点、人月与单价），不逐行罗列
confirm_page: false
# 大纲外壳：模块是“专家必问的问题”，不是文档必须有的章节；原文没有对应内容的模块不设章（概况、必要性除外）
# 章名用原文的叫法；原文特有的重要内容可新增模块并指定位置（见 frame 提示词）
skeleton_by: 建设内容
group_units: true                  # 建设内容单元（子系统、模块、分包等）≥3 个时合成一章，每个单元作为小节
units_title: 建设内容              # 合成章的默认章名（大纲骨架阶段可改用原文叫法，如“服务内容”）
shell:
  before:
    - {module: 项目概况, covers: 项目名称、申报单位与实施单位、总投资及构成、建设周期、采购方式、建设内容简介, required: true, pages: 1}
    - {module: 立项必要性, covers: 立项依据（政策文件）、现状与存在问题、业务需求与功能需求分析（与问题逐条对应）, required: true, min_pages: 2}
    - {module: 前期基础, covers: 上期项目建设成效、已有系统与资源基础（续建或升级项目且原文有专章时）, optional: true}
  after:
    - {module: 技术方案, expected: true, covers: 总体架构、技术路线、安全可靠技术路线与国产化、系统整合与业务协同、网络与数据安全设计}
    - {module: 投资估算, expected: true, covers: 项目预算及采购方式、预算明细（分项金额）、测算依据（功能点、人月、单价、取费标准）}
    - {module: 绩效目标与效益, expected: true, covers: 绩效目标、综合成本测算、行政效率与成本、社会经济效益、可复用推广成果}
    - {module: 实施安排, covers: 实施进度计划、组织管理、监理与测评等第三方服务、风险分析与应对, optional: true}
baseline_questions: [为什么必须立项、为什么现在做, 投资怎么测算、是否合理, 怎么组织实施、何时完成]
