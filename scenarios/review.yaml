display_name: 方案评审汇报
description: 技术方案、建设方案、实施方案的评审，判断方案是否可行、是否值得、风险是否可控
principle: 结论先行。先讲目标与结论，再讲方案概览与关键设计取舍，然后讲实施计划、成本与风险，最后讲保障措施、成果与指标。每页回答"能不能做、值不值、风险多大"。结论先行指主线和每页标题先给判断；第一页仍讲现状问题与目标，不要求第一页给出评审结论。
default_duration_min: 15
density: dense                  # 评审类默认高密度（0.5）
minutes_per_page: 1.5
structural_pages: [cover, agenda, closing]
structural_minutes: 0.3
closing_title: 恳请各位专家批评指正
title_style: 结论式标题，直接给出判断或数据，如"新架构可将响应时间由800ms降至480ms"
focus_checklist:
  - 背景、现状问题与建设目标
  - 方案总体思路与总体架构
  - 关键技术路线与设计取舍（为什么这样选）
  - 关键指标与预期效果
  - 建设范围与边界
  - 实施计划、资源与成本
  - 风险与应对措施
  - 技术重难点与创新点
  - 质量控制、测试验收与安全保障
special_rules:
  - 不设“需评审确认事项”页：评审是专家提问、专家判断，汇报只把方案讲清楚，不替专家列议题。原文中写明待确认、待明确或作为备选的事项，在相关页面的要点或备注中如实说明（如“有监督微调为备选手段，评测不达标时启用”），不单独成页、不放在结尾
  - 风险要如实呈现，不得淡化；原文没有风险分析时不要拼凑
  - 原文没有专章、但多处写明了技术难点及对应做法时，设“技术重难点与应对”归纳页；同理设“技术创新点”“质量控制与安全保障”归纳页（原文确实没有依据的除外）。归纳页的每一条难点、做法、亮点都必须出自原文具体段落（sources 列出这些段落所在章节），不得自拟
confirm_page: false                # 是否允许“需确认事项”页（0.5：评审类不设，用户明确要求时除外）
# 大纲外壳（0.6）：骨架前后固定加的模块；骨架按什么取；只作提示的底线问题
skeleton_by: 建设内容              # 文档在讲的几项建设内容（或建设任务、技术方案的组成部分）
shell:
  before:
    - {module: 概述与基础, covers: 项目来源与依据、背景与现状问题、建设目标、建设内容总览、已有基础与资源}
    - {module: 总体技术路线, covers: 总体架构、总体技术路线、技术选型（原文有时）}
  after:
    - module: 保障与亮点
      covers: 技术重难点与应对、技术创新点、质量控制、测试验收与安全保障
      optional: true
      synthesis: true                # 跨章归纳：其他章展开后，以已规划的页面为素材提炼
      topics:                        # 每个主题一页；原文依据不足的主题在 topic_skips 中说明
        - {name: 技术重难点与应对, keys: [难点, 难题, 挑战, 应对]}
        - {name: 技术创新点, keys: [创新, 特色, 亮点]}
        - {name: 质量控制与安全保障, keys: [质量, 安全, 保障, 质控]}
    - {module: 成果与计划, covers: 交付成果、关键技术指标汇总、实施计划与进度}
baseline_questions: [项目要解决什么问题、达到什么目标, 怎么保证按期交付]
